<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>יוצאים בשאלה | דשבורד ביצועים</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg:      #0f1117;
    --surface: #1a1d27;
    --border:  #2a2d3a;
    --text:    #e8eaf0;
    --muted:   #8b8fa8;
    --accent:  #6c63ff;
    --accent2: #ff6584;
    --green:   #43d9ad;
    --yellow:  #ffd166;
    --r:       14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--bg); color: var(--text); direction: rtl; }

  /* ── Password ── */
  #pw-overlay {
    position: fixed; inset: 0; z-index: 9999; background: var(--bg);
    display: flex; align-items: center; justify-content: center;
  }
  #pw-box {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 20px; padding: 48px 40px; width: 340px; text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  #pw-box h2 { font-size: 1.5rem; margin-bottom: 6px; }
  #pw-box p  { color: var(--muted); font-size: .9rem; margin-bottom: 28px; }
  #pw-input {
    width: 100%; padding: 12px 16px; background: var(--bg); border: 1px solid var(--border);
    border-radius: 10px; color: var(--text); font-size: 1rem; text-align: center;
    outline: none; margin-bottom: 12px; direction: ltr;
  }
  #pw-input:focus { border-color: var(--accent); }
  #pw-btn {
    width: 100%; padding: 12px; background: var(--accent); border: none;
    border-radius: 10px; color: #fff; font-size: 1rem; cursor: pointer; transition: opacity .2s;
  }
  #pw-btn:hover { opacity: .85; }
  #pw-err { color: var(--accent2); font-size: .85rem; margin-top: 10px; min-height: 20px; }

  /* ── Layout ── */
  #app { display: none; max-width: 1100px; margin: 0 auto; padding: 32px 20px 60px; }

  header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 36px; flex-wrap: wrap; gap: 12px;
  }
  .header-left { display: flex; align-items: center; gap: 14px; }
  .logo {
    width: 52px; height: 52px; border-radius: 14px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center; font-size: 1.6rem;
  }
  header h1 { font-size: 1.7rem; font-weight: 700; }
  .subtitle  { color: var(--muted); font-size: .85rem; margin-top: 2px; }
  #last-updated { color: var(--muted); font-size: .82rem; }

  /* ── Section ── */
  .section-hdr {
    display: flex; align-items: center; gap: 10px;
    font-size: 1.1rem; font-weight: 600; margin: 40px 0 18px;
  }
  .sec-badge {
    width: 34px; height: 34px; border-radius: 9px;
    display: flex; align-items: center; justify-content: center; font-size: 1.1rem;
  }
  .sec-yt  { background: rgba(255,101,132,.18); }
  .sec-aud { background: rgba(108,99,255,.18); }

  /* ── Cards ── */
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px,1fr)); gap: 16px; margin-bottom: 24px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 22px 20px; }
  .card .lbl { color: var(--muted); font-size: .78rem; margin-bottom: 8px; }
  .card .val { font-size: 1.9rem; font-weight: 700; line-height: 1; }
  .card .sub { color: var(--muted); font-size: .76rem; margin-top: 6px; }

  /* ── Episode card ── */
  .ep-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r); padding: 24px 24px; margin-bottom: 24px;
    display: flex; align-items: flex-start; gap: 20px; flex-wrap: wrap;
  }
  .ep-thumb {
    width: 180px; height: 101px; border-radius: 10px; object-fit: cover;
    background: var(--border); flex-shrink: 0;
  }
  .ep-thumb-placeholder {
    width: 180px; height: 101px; border-radius: 10px;
    background: linear-gradient(135deg, #2a2d3a, #1a1d27);
    display: flex; align-items: center; justify-content: center;
    font-size: 2.5rem; flex-shrink: 0;
  }
  .ep-info { flex: 1; min-width: 200px; }
  .ep-info .ep-title { font-size: 1.05rem; font-weight: 600; margin-bottom: 6px; }
  .ep-info .ep-title a { color: var(--text); text-decoration: none; }
  .ep-info .ep-title a:hover { color: var(--accent); }
  .ep-info .ep-meta { color: var(--muted); font-size: .82rem; margin-bottom: 14px; }
  .ep-stats { display: flex; gap: 24px; flex-wrap: wrap; }
  .ep-stat .es-val { font-size: 1.4rem; font-weight: 700; color: var(--green); }
  .ep-stat .es-lbl { color: var(--muted); font-size: .75rem; }

  /* ── Chart ── */
  .chart-wrap {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r); padding: 24px 20px; margin-bottom: 24px;
  }
  .chart-wrap h3 { font-size: .85rem; color: var(--muted); margin-bottom: 16px; }
  .chart-wrap canvas { max-height: 220px; }

  /* ── Coming soon ── */
  .coming-soon {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r); padding: 40px 24px; text-align: center;
    color: var(--muted); margin-bottom: 24px;
  }
  .coming-soon .icon { font-size: 2.2rem; margin-bottom: 12px; }
  .coming-soon strong { display: block; color: var(--text); margin-bottom: 6px; }

  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  @media (max-width: 600px) {
    .ep-thumb, .ep-thumb-placeholder { width: 100%; height: 180px; }
  }
</style>
</head>
<body>

<!-- Password -->
<div id="pw-overlay">
  <div id="pw-box">
    <div style="font-size:2.5rem;margin-bottom:14px">🎙️</div>
    <h2>יוצאים בשאלה</h2>
    <p>דשבורד ביצועים</p>
    <input id="pw-input" type="password" placeholder="סיסמה" autocomplete="current-password">
    <button id="pw-btn" onclick="checkPassword()">כניסה</button>
    <div id="pw-err"></div>
  </div>
</div>

<!-- App -->
<div id="app">
  <header>
    <div class="header-left">
      <div class="logo">🎙️</div>
      <div>
        <h1>יוצאים בשאלה</h1>
        <div class="subtitle">דשבורד ביצועים · פודקאסט הלל</div>
      </div>
    </div>
    <div id="last-updated"></div>
  </header>
  <div id="content"><div style="text-align:center;padding:60px;color:var(--muted)">⏳ טוען…</div></div>
</div>

<script>
const PASSWORD = 'iritirit';

function checkPassword() {
  if (document.getElementById('pw-input').value === PASSWORD) {
    document.getElementById('pw-overlay').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    loadData();
  } else {
    document.getElementById('pw-err').textContent = 'סיסמה שגויה';
    document.getElementById('pw-input').value = '';
  }
}
document.getElementById('pw-input').addEventListener('keydown', e => { if (e.key === 'Enter') checkPassword(); });

const fmt  = n => (n||0).toLocaleString('he-IL');
const fmtK = n => n >= 1000000 ? (n/1e6).toFixed(1)+'M' : n >= 1000 ? (n/1000).toFixed(1)+'K' : String(n||0);

function card(lbl, val, sub='') {
  return `<div class="card"><div class="lbl">${lbl}</div><div class="val">${val}</div>${sub?`<div class="sub">${sub}</div>`:''}</div>`;
}

function render(d) {
  document.getElementById('last-updated').textContent = 'עודכן: ' + (d.updated || '');
  const yt = d.video?.youtube || {};
  const sv = d.video?.spotify_video || {};
  const au = d.audio || {};

  let html = '';

  /* ── YouTube section ── */
  html += `<div class="section-hdr"><div class="sec-badge sec-yt">📺</div>YouTube</div>`;

  const ytVideos = yt.videos || [];
  const totalViews = yt.total_views || 0;

  html += `<div class="cards">
    ${card('סה"כ צפיות', fmtK(totalViews), `${fmt(yt.video_count||0)} פרקים`)}
    ${card('פרק אחרון', ytVideos.length ? fmtK(ytVideos[0].views) + ' צפיות' : '—', ytVideos.length ? ytVideos[0].date : '')}
  </div>`;

  if (ytVideos.length > 0) {
    ytVideos.forEach(ep => {
      const thumb = `https://img.youtube.com/vi/${ep.id}/mqdefault.jpg`;
      html += `<div class="ep-card">
        <img class="ep-thumb" src="${thumb}" alt="" onerror="this.style.display='none'">
        <div class="ep-info">
          <div class="ep-title"><a href="${ep.url}" target="_blank">${ep.title}</a></div>
          <div class="ep-meta">${ep.date || ''}</div>
          <div class="ep-stats">
            <div class="ep-stat"><div class="es-val">${fmt(ep.views)}</div><div class="es-lbl">צפיות</div></div>
          </div>
        </div>
      </div>`;
    });

    if ((yt.monthly||[]).length > 1) {
      html += `<div class="chart-wrap"><h3>צפיות לפי חודש</h3><canvas id="yt-chart"></canvas></div>`;
    }
  } else {
    html += `<div class="coming-soon"><div class="icon">📺</div><strong>פרקי וידאו בקרוב</strong>הסרטונים יופיעו כאן ברגע שיפורסמו</div>`;
  }

  /* ── Audio section ── */
  html += `<div class="section-hdr"><div class="sec-badge sec-aud">🎧</div>אודיו — Spreaker</div>`;

  if ((au.episode_count || 0) === 0) {
    html += `<div class="coming-soon"><div class="icon">🎧</div><strong>פרקי אודיו בקרוב</strong>נתוני ההאזנות יופיעו כאן לאחר פרסום פרקים ב-Spreaker</div>`;
  } else {
    html += `<div class="cards">
      ${card('סה"כ האזנות', fmtK(au.total_plays), 'כל הפלטפורמות')}
      ${card('פרקים', fmt(au.episode_count), '')}
      ${card('ממוצע לפרק', fmtK(au.episode_count ? Math.round(au.total_plays/au.episode_count) : 0), 'האזנות')}
    </div>`;
  }

  /* ── Spotify Video ── */
  if ((sv.total_plays || 0) > 0 || (sv.episodes||[]).length > 0) {
    html += `<div class="section-hdr"><div class="sec-badge sec-yt">🎵</div>Spotify Video</div>`;
    html += `<div class="cards">${card('הפעלות', fmtK(sv.total_plays||0), 'Spotify Video')}</div>`;
  }

  document.getElementById('content').innerHTML = html;

  // Render YT monthly chart if data exists
  if ((yt.monthly||[]).length > 1) {
    const monthly = yt.monthly;
    new Chart(document.getElementById('yt-chart'), {
      type: 'bar',
      data: {
        labels: monthly.map(m => m.month),
        datasets: [{ data: monthly.map(m => m.views), backgroundColor: '#ff658466', borderColor: '#ff6584', borderWidth: 1, borderRadius: 4 }]
      },
      options: {
        responsive: true, maintainAspectRatio: true,
        plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => ' ' + fmt(c.parsed.y) } } },
        scales: {
          x: { grid: { color: 'rgba(255,255,255,.05)' }, ticks: { color: '#8b8fa8', font: { size: 11 } } },
          y: { grid: { color: 'rgba(255,255,255,.05)' }, ticks: { color: '#8b8fa8', font: { size: 11 } } }
        }
      }
    });
  }
}

function loadData() {
  fetch('data.json?t=' + Date.now())
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(render)
    .catch(e => { document.getElementById('content').innerHTML = `<div style="text-align:center;padding:60px;color:#ff6584">שגיאה בטעינה: ${e}</div>`; });
}
</script>
</body>
</html>
