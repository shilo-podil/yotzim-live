name: Update Dashboard Data
          SPREAKER_STATS_TOKEN: ${{ secrets.SPREAKER_STATS_TOKEN }}

on:
  schedule:
    - cron: '0 5 * * *'   # Every day at 05:00 UTC
  workflow_dispatch:        # Manual trigger from Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests yt-dlp

      - name: Fetch data
        run: python scripts/fetch_data.py
        env:
          SPREAKER_SHOW_ID: '4956945'
          YOUTUBE_CHANNEL: '@hillel-il'
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}

          SPREAKER_STATS_TOKEN: ${{ secrets.SPREAKER_STATS_TOKEN }}
      - name: Commit and push
        run: |
          git config user.name  "Dashboard Bot"
          git config user.email "bot@github.com"
          git add data.json
        f git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update data $(date +%Y-%m-%d)"
            git push
          fi
